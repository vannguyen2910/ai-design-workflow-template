      <text x="396" y="538" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">• Get past the barriers to trying</text>

      <text x="652" y="538" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">• Get past the barriers to trying</text>

      <text x="908" y="498" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">• Plan flexibly in one place,</text>

      <text x="908" y="538" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">• Connect with locals in a way</text>

      <text x="908" y="572" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">  transactional</text>
      <text x="1164" y="498" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Keep a record of the trip without</text>
      <text x="1164" y="515" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">the effort</text>

      <text x="396" y="651" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">first; free to start, because</text>

      <text x="908" y="651" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">being willing to take part (not</text>
      <text x="908" y="668" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">researched yet)</text>
      <text x="1164" y="617" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">An automatic trip record that they</text>

      <text x="140" y="823" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">discover further away</text>

      <text x="396" y="807" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  an account; sign-up is only</text>

      <text x="396" y="1007" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  themselves</text>
      <text x="652" y="905" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">One-tap save and importing an AI</text>
      <text x="652" y="921" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">itinerary let people get information</text>
      <text x="652" y="937" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">into the plan without copying by hand</text>
      <text x="908" y="905" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">A two-way exchange frame with</text>
      <text x="908" y="921" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">verified profiles makes users message</text>
      <text x="908" y="937" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">locals without hesitation</text>
      <text x="1164" y="905" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">• Users find the self-generated</text>
      <text x="1164" y="921" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  journal by themselves without being</text>
      <text x="1164" y="937" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  shown</text>
      <text x="1164" y="959" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">• A journal that is private by</text>
      <text x="1164" y="975" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  default and shared with specific</text>
      <text x="1164" y="991" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  people meets the need to share</text>

      <text x="122" y="1049" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">PROBLEMS FOUND</text>
      <text x="122" y="1061" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">IN THE PROTOTYPE</text>
      <text x="140" y="1051" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">• Seven screens before the first tip,</text>
      <text x="140" y="1067" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  with only a small shortcut</text>
      <text x="140" y="1089" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">• Near Me shows a preselected</text>
      <text x="140" y="1105" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  destination, even with location off</text>
      <text x="140" y="1127" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">• A trip and past journals exist</text>
      <text x="140" y="1143" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  before any trip is made</text>
      <text x="396" y="1051" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">The “X% match” badge does not explain</text>
      <text x="396" y="1067" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">what it is based on</text>
      <text x="652" y="1051" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">• The AI itinerary parser keeps the</text>
      <text x="652" y="1067" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  day label as part of the place name</text>
      <text x="652" y="1083" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  and does not fit into the existing</text>
      <text x="652" y="1099" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  day structure</text>
      <text x="652" y="1121" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">• An entry from AI shows a grey image</text>
      <text x="652" y="1137" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  and a dash instead of a duration,</text>
      <text x="652" y="1153" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  looking lower quality than a tip</text>
      <text x="652" y="1169" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  saved by hand</text>
      <text x="652" y="1191" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">• Two Plan controls start a new trip</text>
      <text x="652" y="1207" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  with different words</text>
      <text x="908" y="1051" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">• The Connect → Browse screen has no</text>
      <text x="908" y="1067" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  search or filter; a specific local</text>
      <text x="908" y="1083" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  can only be found by working</text>
      <text x="908" y="1099" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  backwards through their tips</text>
      <text x="908" y="1121" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">• The Browse list mixes locals from</text>
      <text x="908" y="1137" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  many cities, with no filter by</text>
      <text x="908" y="1153" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  location or trip</text>
      <text x="908" y="1175" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">• The label “Local resident” while</text>
      <text x="908" y="1191" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  the task says “another traveler”</text>
      <text x="908" y="1213" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">• Capture banner for a trip the</text>
      <text x="908" y="1229" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  traveller never started</text>
      <text x="1164" y="1051" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">• The journal sharing screen only has</text>
      <text x="1164" y="1067" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  a fixed list of 3 people, with no</text>
      <text x="1164" y="1083" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  search or invite by name; someone</text>
      <text x="1164" y="1099" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  outside the list cannot be chosen</text>
      <text x="1164" y="1121" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">• Plan and Journal show different</text>
      <text x="1164" y="1137" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">  dates for one trip</text>
