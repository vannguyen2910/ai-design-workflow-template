<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Buddy: Pre-Trip</title>
<style>
:root{--bg:#fff;--panel:#fff;--ink:#1c252e;--muted:#637381;--line:#919eab;--card:#fff;--cardline:rgba(145,158,171,.32);--dots:rgba(145,158,171,.28)}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:100%;margin:0;padding:18px 20px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:0 4px 8px}
h1{margin:0;font-size:1.2rem;font-weight:800;letter-spacing:-.01em}
.sum{color:var(--muted);font-size:.85rem}
.leg{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:center;margin:0 4px 12px;font-size:.78rem;color:var(--muted)}
.lgroup{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.lgroup b{font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);opacity:.85;margin-right:2px}
.lgroup span{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%}
.lg{fill:none;stroke:var(--muted);stroke-width:1.4}.lg.dash{stroke-dasharray:3 3}
.panel{background:var(--panel);border:0;border-radius:16px;overflow:hidden;box-shadow:0 0 2px 0 rgba(145,158,171,.2),0 12px 24px -4px rgba(145,158,171,.12)}
.scroll{overflow-x:auto;overflow-y:hidden;background-image:radial-gradient(var(--dots) 1px,transparent 1px);background-size:18px 18px;scrollbar-width:thin}
svg{display:block}
.e{fill:none;stroke:var(--line);stroke-width:1.6}
.e.main{stroke:var(--muted);stroke-width:2}
.e.back{stroke-dasharray:6 5}
.e.hi{stroke:var(--ink);stroke-width:2.4}
.el{font-size:11px;fill:var(--muted);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.card{fill:var(--card);stroke:var(--cardline);stroke-width:1.3}
.inner{fill:none;stroke:var(--cardline);stroke-width:1.3}
.card.dec{stroke:var(--c);stroke-width:1.5}
.card.pill{fill:none;stroke:var(--line);stroke-dasharray:3 4}
.nl{font-size:14px;font-weight:600;fill:var(--ink)}
.nl.dl{font-size:13px}
.nl.pl{font-weight:500;fill:var(--muted)}
.ns{font-size:12px;fill:var(--muted)}
.n:hover .card{stroke:var(--ink)}
.hint{padding:10px 6px 0;font-size:.78rem;color:var(--muted)}
</style></head><body><div class="wrap">
<header><h1>Travel Buddy: Pre-Trip</h1><span class="sum">10 steps</span></header>
<div class="leg"><div class="lgroup"><b>Shapes</b><span><svg width="24" height="14" viewBox="0 0 24 14"><rect x="1" y="1" width="20" height="12" rx="3" class="lg"/></svg>Action or screen</span><span><svg width="24" height="14" viewBox="0 0 24 14"><rect x="1" y="2" width="22" height="10" rx="5" class="lg"/></svg>Start or end</span><span><svg width="24" height="14" viewBox="0 0 24 14"><rect x="1" y="2" width="22" height="10" rx="5" class="lg dash"/></svg>Link to another phase</span></div><div class="lgroup"><b>Colour = solution group</b><span><i style="background:#00b8d9"></i>Discover</span><span><i style="background:#1c252e"></i>Plan</span></div></div>
<div class="panel"><div class="scroll"><svg xmlns="http://www.w3.org/2000/svg" width="3432" height="222" viewBox="0 0 3432 222" role="img" aria-label="Travel Buddy: Pre-Trip">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#919eab"/></marker></defs>
<path class="e main" data-a="n8" data-b="n9" d="M496.0 114.0 L560.0 114.0" marker-end="url(#ah)"/>
<path class="e main" data-a="n9" data-b="n10" d="M760.0 114.0 L824.0 114.0" marker-end="url(#ah)"/>
<path class="e main" data-a="n10" data-b="n11" d="M1024.0 114.0 L1088.0 114.0" marker-end="url(#ah)"/>
<path class="e main" data-a="n11" data-b="n12" d="M1288.0 114.0 L1352.0 114.0" marker-end="url(#ah)"/>
<path class="e main" data-a="n12" data-b="n13" d="M1552.0 114.0 L1616.0 114.0" marker-end="url(#ah)"/>
<path class="e main" data-a="n13" data-b="n14" d="M1816.0 114.0 L1880.0 114.0" marker-end="url(#ah)"/>
<path class="e main" data-a="n14" data-b="n15" d="M2080.0 114.0 L2144.0 114.0" marker-end="url(#ah)"/>
<path class="e main" data-a="n15" data-b="n16" d="M2344.0 114.0 L2408.0 114.0" marker-end="url(#ah)"/>
<path class="e main" data-a="n16" data-b="n17" d="M2608.0 114.0 L2672.0 114.0" marker-end="url(#ah)"/>
<path class="e main" data-a="n17" data-b="n18" d="M2872.0 114.0 L2936.0 114.0" marker-end="url(#ah)"/>
<path class="e main" data-a="n18" data-b="to_next" d="M3136.0 114.0 L3200.0 114.0" marker-end="url(#ah)"/>
<path class="e main" data-a="from_prev" data-b="n8" d="M232.0 114.0 L296.0 114.0" marker-end="url(#ah)"/>
<text class="el" x="264" y="106" text-anchor="middle">Later</text>
<g class="n" data-id="from_prev" style="--c:#919eab"><rect class="card pill" x="32" y="84" width="200" height="60" rx="30"/><text class="nl pl" x="132" y="112" text-anchor="middle">From Onboarding</text><text class="ns" x="132" y="131" text-anchor="middle">/ Between Trips</text></g>
<g class="n" data-id="n8" style="--c:#919eab"><rect class="card" x="296" y="82" width="200" height="64" rx="32"/><text class="nl" x="396" y="119" text-anchor="middle">Enter Discovery</text></g>
<g class="n" data-id="n9" style="--c:#00b8d9"><title>SP-D1 (no decision yet)</title><rect class="card" x="560" y="70" width="200" height="88" rx="8"/><text class="nl" x="660" y="119" text-anchor="middle">Peer-sourced tip feed</text></g>
<g class="n" data-id="n10" style="--c:#00b8d9"><title>SP-D2 (no decision yet)</title><rect class="card" x="824" y="70" width="200" height="88" rx="8"/><text class="nl" x="924" y="119" text-anchor="middle">Filter by travel style</text></g>
<g class="n" data-id="n11" style="--c:#00b8d9"><title>SP-D3 → decision D3</title><rect class="card" x="1088" y="70" width="200" height="88" rx="8"/><text class="nl" x="1188" y="119" text-anchor="middle">Check crowd signal</text></g>
<g class="n" data-id="n12" style="--c:#00b8d9"><title>SP-D4 (no decision yet)</title><rect class="card" x="1352" y="70" width="200" height="88" rx="8"/><text class="nl" x="1452" y="119" text-anchor="middle">Watch video snippet</text></g>
<g class="n" data-id="n13" style="--c:#00b8d9"><title>SP-D5 (no decision yet)</title><rect class="card" x="1616" y="70" width="200" height="88" rx="8"/><text class="nl" x="1716" y="119" text-anchor="middle">Review safety context</text></g>
<g class="n" data-id="n14" style="--c:#1c252e"><title>SP-P3 → decision D4</title><rect class="card" x="1880" y="70" width="200" height="88" rx="8"/><text class="nl" x="1980" y="112" text-anchor="middle">One-tap save</text><text class="ns" x="1980" y="131" text-anchor="middle">to shortlist</text></g>
<g class="n" data-id="n15" style="--c:#1c252e"><title>SP-P6 → decision D5</title><rect class="card" x="2144" y="70" width="200" height="88" rx="8"/><text class="nl" x="2244" y="119" text-anchor="middle">Import AI itinerary</text></g>
<g class="n" data-id="n16" style="--c:#1c252e"><title>SP-P1 (no decision yet)</title><rect class="card" x="2408" y="70" width="200" height="88" rx="8"/><text class="nl" x="2508" y="119" text-anchor="middle">Build living shortlist</text></g>
<g class="n" data-id="n17" style="--c:#1c252e"><title>SP-P5 (no decision yet)</title><rect class="card" x="2672" y="70" width="200" height="88" rx="8"/><text class="nl" x="2772" y="112" text-anchor="middle">Collaborate</text><text class="ns" x="2772" y="131" text-anchor="middle">with companions</text></g>
<g class="n" data-id="n18" style="--c:#1c252e"><title>SP-P2 (no decision yet)</title><rect class="card" x="2936" y="70" width="200" height="88" rx="8"/><text class="nl" x="3036" y="119" text-anchor="middle">Map view of saved places</text></g>
<g class="n" data-id="to_next" style="--c:#919eab"><rect class="card pill" x="3200" y="84" width="200" height="60" rx="30"/><text class="nl pl" x="3300" y="119" text-anchor="middle">Continues In-Destination</text></g>
</svg></div></div>
<p class="hint">Scroll sideways to follow the flow. Hover a step to light up its connections; the solution code and decision are in its tooltip.</p>
</div>
<script>
document.querySelectorAll('.n').forEach(function(g){var id=g.getAttribute('data-id');
g.addEventListener('mouseenter',function(){document.querySelectorAll('.e').forEach(function(e){if(e.getAttribute('data-a')===id||e.getAttribute('data-b')===id)e.classList.add('hi')})});
g.addEventListener('mouseleave',function(){document.querySelectorAll('.e.hi').forEach(function(e){e.classList.remove('hi')})});});
</script>
</body></html>
