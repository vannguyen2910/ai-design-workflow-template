# Đăng hub lên GitHub Pages thành một website.
# Mặc định workflow này TẮT. Bật bằng cách tạo repo variable PUBLISH_HUB = true
# (Settings → Secrets and variables → Actions → Variables). Xem guides/04-share-your-hub.md, Option 6.
name: Publish hub

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*/hub/**'
      - '*/learnings/**'
      - '*/tools/**'
      - '*/case-log.md'
      - '*/README.md'
      - 'site/**'
      - '.github/workflows/publish-hub.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ vars.PUBLISH_HUB == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick the case to publish
        env:
          # Tên folder case để đăng. Để trống thì dùng folder dự án duy nhất tạo bằng tools/new-case.py, nếu không có thì my-case.
          HUB_CASE: ${{ vars.HUB_CASE }}
        run: echo "HUB_CASE_DIR=$(bash site/scripts/find-case.sh)" >> "$GITHUB_ENV"
      - name: Build site
        working-directory: site
        env:
          HUB_BASE: /${{ github.event.repository.name }}/
          HUB_SITE: https://${{ github.repository_owner }}.github.io
        run: |
          npm install --no-audit --no-fund
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
